# Documentation-only target: full paper configuration is not feasible on 8 GB M1.
num_queries: 64
ocr_encoder: DocFormerV2 encoder (344M), visual branch omitted
base_vlm: LLaVA-OneVision, InternVL2, or Qwen2-VL; frozen
stage_1_steps: 140000
stage_1_freeze_ocr_steps: 10000
stage_2_steps: 100000
optimizer: AdamW
scheduler: cosine
warmup_steps: 1000
projection_and_queries_lr: 0.0001
ocr_encoder_lr: 0.00005
stage_2_lr: 0.000005
